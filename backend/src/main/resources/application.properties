spring.application.name=chess_app
spring.data.mongodb.uri=${MONGODB_URI}

# Firebase Configuration
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Debug
app.debug.enabled=${DEBUG_ENABLED}

# Server
server.port=${PORT}


# MongoDB Logging (optional, helps with debugging)
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG


# Avoid auto-config that causes crash
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Redis Configuration
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.password=${REDIS_PASSWORD}

auth.secure=${AUTH_SECURE}
auth.cross.site=${AUTH_CROSS_SITE}


